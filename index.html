<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Snux Dz - متجر إلكتروني</title>

  <meta name="description"
        content="Snux Dz - احصل على جميع منتجاتك بسعر معقول">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7f6;
      color: #17221d;
    }

    /* ================= HEADER ================= */

    header {
      background: #0b8f4d;
      color: white;
      padding: 15px 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo span {
      color: #d9ff55;
    }

    .cart-button {
      border: none;
      background: white;
      color: #087d43;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-button:hover {
      background: #e8fff2;
    }

    /* ================= HERO ================= */

    .hero {
      background: linear-gradient(135deg, #087d43, #12b765);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .welcome-button {
      border: none;
      background: #ffffff;
      color: #087d43;
      padding: 13px 22px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= SEARCH ================= */

    .search-section {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search-box {
      width: 100%;
      padding: 17px 20px;
      border: 2px solid #d5ddd9;
      border-radius: 35px;
      font-size: 17px;
      outline: none;
      background: white;
    }

    .search-box:focus {
      border-color: #0b8f4d;
    }

    /* ================= PRODUCTS ================= */

    .products-section {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product-image {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      background: #e8f7ef;
    }

    .product-info {
      padding: 18px;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .product-description {
      color: #68746e;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      color: #0b8f4d;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .add-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0b8f4d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-button:hover {
      background: #076d3a;
    }

    .no-products {
      text-align: center;
      font-size: 18px;
      padding: 40px;
      display: none;
    }

    /* ================= CART ================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 2000;
    }

    .cart-overlay.active {
      display: block;
    }

    .cart {
      position: absolute;
      top: 0;
      left: 0;
      width: min(420px, 90%);
      height: 100%;
      background: white;
      padding: 25px;
      overflow-y: auto;
      box-shadow: 5px 0 20px rgba(0,0,0,0.2);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .close-cart {
      border: none;
      background: #eee;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .cart-item-icon {
      font-size: 35px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #0b8f4d;
    }

    .remove-item {
      border: none;
      background: #ffe5e5;
      color: #d00000;
      padding: 7px;
      border-radius: 7px;
      cursor: pointer;
    }

    .cart-total {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #ddd;
      font-size: 21px;
      font-weight: bold;
    }

    .order-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: #0b8f4d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 50px;
      background: #102019;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    footer p {
      margin: 7px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .logo {
        font-size: 22px;
      }

      .cart-button {
        font-size: 14px;
        padding: 9px 12px;
      }

      .hero {
        padding: 45px 15px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .hero p {
        font-size: 17px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 140px;
        font-size: 55px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 16px;
      }

      .price {
        font-size: 17px;
      }

      .add-button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>
    <div class="header-content">

      <div class="logo">
        Snux <span>Dz</span>
      </div>

      <button class="cart-button" onclick="openCart()">
        🛒 السلة
        <span id="cartCount">0</span>
      </button>

    </div>
  </header>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <h1>مرحبًا بك في Snux Dz 🛍️</h1>

    <p>
      احصل على جميع منتجاتك بسعر معقول 😱
    </p>

    <button class="welcome-button" onclick="welcomeVoice()">
      🔊 اسمع رسالة الترحيب
    </button>

  </section>


  <!-- ================= SEARCH ================= -->

  <section class="search-section">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 ابحث عن منتج..."
      oninput="searchProducts()"
    >

  </section>


  <!-- ================= PRODUCTS ================= -->

  <section class="products-section">

    <h2 class="section-title">
      🛍️ منتجاتنا
    </h2>

    <div id="products" class="products"></div>

    <div id="noProducts" class="no-products">
      😔 لم نجد هذا المنتج.
    </div>

  </section>


  <!-- ================= CART ================= -->

  <div id="cartOverlay" class="cart-overlay">

    <div class="cart">

      <div class="cart-header">

        <h2>🛒 سلة المشتريات</h2>

        <button class="close-cart" onclick="closeCart()">
          ×
        </button>

      </div>

      <div id="cartItems"></div>

      <div class="cart-total">
        المجموع:
        <span id="cartTotal">0</span> دج
      </div>

      <button class="order-button" onclick="placeOrder()">
        📦 إتمام الطلب
      </button>

    </div>

  </div>


  <!-- ================= FOOTER ================= -->

  <footer>

    <h2>Snux Dz</h2>

    <p>
      جميع منتجاتك بسعر معقول
    </p>

    <p>
      © 2026 Snux Dz - جميع الحقوق محفوظة
    </p>

  </footer>


  <script>

    /* ==========================================
       PRODUCTS
    ========================================== */

    const products = [

      {
        id: 1,
        name: "سماعات لاسلكية",
        description: "سماعات بلوتوث بجودة جيدة",
        price: 2500,
        icon: "🎧"
      },

      {
        id: 2,
        name: "ساعة ذكية",
        description: "ساعة ذكية أنيقة وعملية",
        price: 4500,
        icon: "⌚"
      },

      {
        id: 3,
        name: "حقيبة ظهر",
        description: "حقيبة مناسبة للاستعمال اليومي",
        price: 3200,
        icon: "🎒"
      },

      {
        id: 4,
        name: "حذاء رياضي",
        description: "حذاء رياضي مريح",
        price: 6500,
        icon: "👟"
      },

      {
        id: 5,
        name: "نظارات شمسية",
        description: "تصميم عصري وأنيق",
        price: 1800,
        icon: "🕶️"
      },

      {
        id: 6,
        name: "عطر",
        description: "عطر برائحة مميزة",
        price: 3500,
        icon: "🧴"
      },

      {
        id: 7,
        name: "مصباح LED",
        description: "مصباح LED للمنزل",
        price: 1500,
        icon: "💡"
      },

      {
        id: 8,
        name: "إكسسوارات هاتف",
        description: "إكسسوارات متنوعة للهاتف",
        price: 1200,
        icon: "📱"
      }

    ];


    /* ==========================================
       CART
    ========================================== */

    let cart = [];


    /* ==========================================
       DISPLAY PRODUCTS
    ========================================== */

    function displayProducts(list = products) {

      const container = document.getElementById("products");

      const noProducts = document.getElementById("noProducts");

      container.innerHTML = "";

      if (list.length === 0) {

        noProducts.style.display = "block";

        return;

      }

      noProducts.style.display = "none";


      list.forEach(product => {

        const productHTML = `

          <div class="product">

            <div class="product-image">
              ${product.icon}
            </div>

            <div class="product-info">

              <div class="product-name">
                ${product.name}
              </div>

              <div class="product-description">
                ${product.description}
              </div>

              <div class="price">
                ${product.price.toLocaleString("ar-DZ")} دج
              </div>

              <button
                class="add-button"
                onclick="addToCart(${product.id})"
              >
                🛒 أضف إلى السلة
              </button>

            </div>

          </div>

        `;

        container.innerHTML += productHTML;

      });

    }


    /* ==========================================
       SEARCH
    ========================================== */

    function searchProducts() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      const filtered = products.filter(product =>

        product.name.toLowerCase().includes(search) ||

        product.description.toLowerCase().includes(search)

      );


      displayProducts(filtered);

    }


    /* ==========================================
       ADD TO CART
    ========================================== */

    function addToCart(id) {

      const product =
        products.find(item => item.id === id);


      const existing =
        cart.find(item => item.id === id);


      if (existing) {

        existing.quantity++;

      } else {

        cart.push({

          ...product,

          quantity: 1

        });

      }


      updateCart();


      alert(
        "✅ تمت إضافة " +
        product.name +
        " إلى السلة"
      );

    }


    /* ==========================================
       UPDATE CART
    ========================================== */

    function updateCart() {

      const cartItems =
        document.getElementById("cartItems");

      const cartCount =
        document.getElementById("cartCount");

      const cartTotal =
        document.getElementById("cartTotal");


      cartItems.innerHTML = "";


      let total = 0;

      let count = 0;


      cart.forEach(item => {

        total += item.price * item.quantity;

        count += item.quantity;


        cartItems.innerHTML += `

          <div class="cart-item">

            <div class="cart-item-icon">
              ${item.icon}
            </div>

            <div class="cart-item-info">

              <div class="cart-item-name">
                ${item.name}
              </div>

              <div>
                الكمية: ${item.quantity}
              </div>

              <div class="cart-item-price">
                ${(item.price * item.quantity)
                  .toLocaleString("ar-DZ")} دج
              </div>

            </div>

            <button
              class="remove-item"
              onclick="removeFromCart(${item.id})"
            >
              حذف
            </button>

          </div>

        `;

      });


      cartCount.textContent = count;

      cartTotal.textContent =
        total.toLocaleString("ar-DZ");

    }


    /* ==========================================
       REMOVE FROM CART
    ========================================== */

    function removeFromCart(id) {

      cart =
        cart.filter(item => item.id !== id);

      updateCart();

    }


    /* ==========================================
       OPEN CART
    ========================================== */

    function openCart() {

      document
        .getElementById("cartOverlay")
        .classList.add("active");

    }


    /* ==========================================
       CLOSE CART
    ========================================== */

    function closeCart() {

      document
        .getElementById("cartOverlay")
        .classList.remove("active");

    }


    /* ==========================================
       ORDER
    ========================================== */

    function placeOrder() {

      if (cart.length === 0) {

        alert("🛒 السلة فارغة.");

        return;

      }


      alert(
        "📦 تم تجهيز طلبك!\n\n" +
        "سنضيف لاحقًا نموذجًا لإدخال اسم الزبون، " +
        "رقم الهاتف، والعنوان."
      );

    }


    /* ==========================================
       WELCOME VOICE
    ========================================== */

    function welcomeVoice() {

      if (!("speechSynthesis" in window)) {

        alert(
          "متصفحك لا يدعم تشغيل الصوت."
        );

        return;

      }


      window.speechSynthesis.cancel();


      const message =
        "مرحباً بك في Snux Dz. " +
        "احصل على جميع منتجاتك بسعر معقول.";


      const speech =
        new SpeechSynthesisUtterance(message);


      speech.lang = "ar-SA";

      speech.rate = 0.9;

      speech.pitch = 1.1;

      speech.volume = 1;


      const voices =
        window.speechSynthesis.getVoices();


      /* محاولة اختيار صوت عربي نسائي */

      const femaleVoice =
        voices.find(voice =>

          voice.lang.toLowerCase().startsWith("ar") &&

          (
            voice.name.toLowerCase().includes("female") ||
            voice.name.toLowerCase().includes("woman") ||
            voice.name.toLowerCase().includes("zira")
          )

        );


      const arabicVoice =
        voices.find(voice =>
          voice.lang.toLowerCase().startsWith("ar")
        );


      if (femaleVoice) {

        speech.voice = femaleVoice;

      } else if (arabicVoice) {

        speech.voice = arabicVoice;

      }


      window.speechSynthesis.speak(speech);

    }


    /* ==========================================
       LOAD VOICES
    ========================================== */

    if ("speechSynthesis" in window) {

      window.speechSynthesis.onvoiceschanged =
        function() {

          // تحميل الأصوات المتاحة
          window.speechSynthesis.getVoices();

        };

    }


    /* ==========================================
       START WEBSITE
    ========================================== */

    displayProducts();

    updateCart();


    /*
      نحاول تشغيل الترحيب عند الدخول.
      بعض المتصفحات تمنع الصوت التلقائي.
    */

    window.addEventListener(
      "load",
      function() {

        setTimeout(function() {

          welcomeVoice();

        }, 800);

      }
    );


  </script>

</body>
</html>
